[project]
name = "homesignal"
version = "0.1.0"
description = "12-month-forward ZIP-level home value growth prediction from public data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.45",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "optuna>=3.6",
    "scipy>=1.12",
]

[project.optional-dependencies]
app = ["gradio>=4.30"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pandas-stubs",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
homesignal = "homesignal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homesignal"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "D"]
ignore = ["D100", "D104", "D107", "D203", "D213", "N803", "N806"]  # X/y naming is the ML convention

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"app/*" = ["D", "E501"]
"src/homesignal/evaluation/report.py" = ["E501"]  # markdown template strings
"tests/test_data.py" = ["E501"]  # verbatim Census lookup-file fixtures

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = false
ignore_missing_imports = true
mypy_path = "src"
packages = ["homesignal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
