name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[app,dev]"
      - name: Lint
        run: .venv/bin/ruff check src tests app && .venv/bin/ruff format --check src tests app
      - name: Type check
        run: .venv/bin/mypy
      - name: Tests (offline, synthetic data)
        run: .venv/bin/python -m pytest -q
